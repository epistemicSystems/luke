name: Persona Impact Simulation

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  simulate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize demo data
      run: python scripts/init_demo_data.py
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GRAPH_DATA_DIR: ./data/graph
        CHROMA_PERSIST_DIR: ./data/chroma

    - name: Run persona simulation
      id: simulation
      run: |
        python -m insight_graph.personas.agents \
          "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}" \
          > simulation.txt
        cat simulation.txt
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GRAPH_DATA_DIR: ./data/graph
        CHROMA_PERSIST_DIR: ./data/chroma

    - name: Post simulation to PR
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const simulation = fs.readFileSync('simulation.txt', 'utf8');

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 🎭 Persona Impact Simulation\n\n${simulation}\n\n---\n_Generated by Insight Graph_`
          });
